# ============================================================
# 教师端前端 nginx 站点配置
# 依赖 server-java 逆代（/api、/videos -> server-java:9002）
# 该文件被拷贝到容器内 /etc/nginx/conf.d/default.conf
# ============================================================

# /api 与 WebSocket 需要透传 Upgrade 头，故把 Connection 定义为映射变量
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 项目需要上传大视频，放开请求体大小限制
    client_max_body_size 1024m;

    # ---------- gzip 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # 上传大文件时加长超时，避免 nginx 提前断开
    proxy_connect_timeout 600s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ---------- 后端 API 反向代理 -> server-java:9002 ----------
    location /api/ {
        proxy_pass http://server-java:9002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---------- 视频/公共文件 -> server-java:9002 ----------
    location /videos/ {
        proxy_pass http://server-java:9002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---------- 静态资源长缓存（带 hash 文件名） ----------
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
